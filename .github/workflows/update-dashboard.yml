name: Update Fantasy Football Dashboard

on:
  schedule:
    # Runs once a day. GitHub Actions cron is UTC; 13:00 UTC is ~8-9am US
    # Eastern depending on daylight saving. Change the minute/hour below if
    # you want a different time, or trigger manually from the Actions tab.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r fetch/requirements.txt

      - name: Fetch league data
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          START_YEAR: ${{ secrets.START_YEAR }}
        run: python fetch/fetch_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/league_history.json
          git diff --cached --quiet || git commit -m "Daily data refresh: $(date -u +'%Y-%m-%d')"
          git push

  deploy:
    needs: update-data
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest
        uses: actions/checkout@v4
        with:
          # IMPORTANT: without this, checkout defaults to the commit that
          # triggered the run (github.sha), which is captured BEFORE the
          # update-data job's "Daily data refresh" commit exists. That
          # silently deployed the previous run's data every time (the site
          # was always one run behind). Pinning to the branch name instead
          # makes checkout fetch whatever is actually at the tip of main
          # right now, i.e. including the data commit update-data just
          # pushed.
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
