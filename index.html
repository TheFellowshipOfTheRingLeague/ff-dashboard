<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fantasy Football League History</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>League History Dashboard</h1>
      <button class="theme-toggle" id="theme-toggle">Toggle theme</button>
    </header>

    <div class="banner">Loading league data&hellip;</div>

    <nav class="tabs">
      <button data-tab="overview" class="active">Overview</button>
      <button data-tab="seasons">Seasons &amp; Drafts</button>
      <button data-tab="trades">All Trades</button>
      <button data-tab="waivers">Waiver Wire</button>
    </nav>

    <div id="app">
      <section class="panel active" id="panel-overview"></section>
      <section class="panel" id="panel-seasons"></section>
      <section class="panel" id="panel-trades"></section>
      <section class="panel" id="panel-waivers"></section>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
